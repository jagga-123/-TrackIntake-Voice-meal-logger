[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = meal_voice/tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:meal_voice.*

# The MongoDB connector reports no transaction support (see docs/architecture.md
# § Testing against MongoDB), so pytest-django flushes every collection after
# each database test. Doing that against the shared Atlas cluster is a real
# network round-trip per test and was observed to hang outright. Tests run
# against a disposable local MongoDB instead: `docker run -d --name
# trackintake-test-mongo -p 27117:27017 mongo:7`. Production is unaffected -
# runserver and deploys keep reading MONGODB_URI from the environment.
env =
    MONGODB_URI=mongodb://localhost:27117/
    MONGODB_NAME=trackintake_test
